  .bubble .typing span:nth-child(3){ animation-delay:.4s; }

<script>

  /* ---------- 지식기반: 수생생물 ---------- */

    { id:"chamgalgeoni", name:"참갈겨니", group:"어류", reach:"상류 ~ 장전역",
      blurb:"상류부터 장전역까지 맑은 물에 풍부합니다. 수컷은 산란기에 붉고 화려한 혼인색을 띱니다.", kw:["참갈겨니","갈겨니"] },
    { id:"dongsari", name:"동사리", group:"어류", reach:"상류 계곡",
      blurb:"한국 고유종으로 상류 돌 밑에 숨어 삽니다. 야행성이며 산란기에 '구구' 소리를 내요.", kw:["동사리"] },
    { id:"kkeokji", name:"꺽지", group:"어류", reach:"상류 계곡",
      blurb:"상류 바위 계곡에 사는 육식 물고기예요. 입이 크고 아가미 뒤의 파란 점이 특징입니다.", kw:["꺽지"] },
    { id:"mikkuri", name:"미꾸리", group:"어류", reach:"중류 ~ 하류",

    { id:"ingeo", name:"잉어", group:"어류", reach:"중류 ~ 하류",

    { id:"soebaengno", name:"쇠백로", group:"조류", reach:"중류 ~ 하류",
      blurb:"중·하류에서 자주 보이는 흰 물새예요. 검은 부리·다리에 노란 발이 특징이며 물고기·개구리를 잡아먹습니다.", kw:["쇠백로","백로"] },
    { id:"waegari", name:"왜가리", group:"조류", reach:"중류 ~ 하류",

    { id:"gamauji", name:"민물가마우지", group:"조류", reach:"하류(겨울철새)",

    { id:"dukkeobi", name:"두꺼비", group:"기타 생물", reach:"하류 연안교 인근",
      blurb:"하류의 인공 연못에 많이 살아요. 낮엔 숨어 있다가 밤·비 올 때 나와 곤충을 잡아먹습니다.", kw:["두꺼비"] },
    { id:"omgaeguri", name:"옴개구리", group:"기타 생물", reach:"상류 계곡",

  ];

  /* ---------- 지식기반: 일반/개요 ---------- */
  var FACTS = [
    { kw:["안녕","하이","반가","hello","hi","ㅎㅇ"], type:"greeting",
      answer:"안녕하세요! 저는 온천천 AI 도우미예요. 🌿<br>온천천의 <b>물고기·물새·수달</b> 같은 수생생물이나 <b>역사</b>에 대해 물어보시면 아는 만큼 답해 드릴게요." },
    { kw:["도움","무엇을물","뭐물어","뭘물어","기능","어떤걸물","무엇을할","도움말"], type:"help",
      answer:"이런 걸 물어볼 수 있어요:<br>• \"수달은 어디 살아?\" 처럼 <b>특정 생물</b><br>• \"온천천에 무슨 물고기가 있어?\" 처럼 <b>생물 목록</b><br>• \"온천천 역사 알려줘\", \"국가하천 승격이 뭐야?\" 처럼 <b>역사</b><br>• \"수질은 어때?\", \"온천천은 어떤 하천이야?\" 같은 <b>개요</b>" },

  /* ---------- 유틸 ---------- */
  function norm(s){ return (s||"").toLowerCase().replace(/\s+/g,"").replace(/[.,!?~·…"'()\-]/g,""); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  /* 종/사실/역사를 하나의 검색 대상으로 합침 */
  function buildKB(){
    var kb = [];
    SPECIES.forEach(function(s){
      var answer = "<b>"+s.name+"</b> · "+s.group+"<br>"+s.blurb+
        "<br><span class=\"ans-meta\">서식 구간: "+s.reach+"</span>";
      kb.push({ kw:s.kw, boost:0, answer:answer,
        link:{href:"온천천의_수생생물.html", label:"수생생물 도감에서 보기 →"} });
    });
    FACTS.forEach(function(f){ kb.push({ kw:f.kw, boost:(f.type==="fact"?1:2), answer:f.answer, link:f.link }); });
    // 역사 이벤트 (공용 데이터에서 생성)
    var HIST_KW = {
      0:["일제","강점기","동래온천","1907"], 1:["제방","1932"],
      2:["산업화","도시화","1970","1980"], 3:["하천정비","기본계획","1989"],
      4:["복개","죽은","1994"], 5:["살리기운동","마스터플랜","2001","2002"],
      6:["1997"], 7:["수질개선","2005","2007","2010","저서생물"],
      8:["복개복원","980","2011","2013"], 9:["재등장","2009","2017"],
      10:["통합관리","협의회","2021"], 11:["국가하천승격","2024","3.79"]
    };
    (window.ONCHEON_HISTORY||[]).forEach(function(e,i){
      kb.push({
        kw:(HIST_KW[i]||[]).concat([e.title]),
        boost:0,
        answer:"<b>"+e.year+" · "+e.title+"</b><br>"+e.content,
        link:{href:"온천천의_역사_상세.html?e="+i, label:"역사 상세 보기 →"}
      });
    });
    return kb;
  }
  var KB = buildKB();

  /* 목록형 의도 */
  function listAnswer(q){
    var groups = { "어류":[], "저서동물":[], "조류":[], "기타 생물":[] };
    SPECIES.forEach(function(s){ groups[s.group].push(s.name); });
    var html = "온천천에는 이런 수생생물들이 살아요 (도감 기준 17종):";
    Object.keys(groups).forEach(function(g){
      html += "<br>• <b>"+g+"</b> — "+groups[g].join(", ");
    });
    return { answer:html, link:{href:"온천천의_수생생물.html", label:"수생생물 도감 열기 →"} };
  }

  /* 지식기반 답변 찾기 */
  function localAnswer(question){
    var q = norm(question);
    // 목록 의도 먼저
    if(/(몇종|몇마리|종류|목록|리스트|어떤생물|무슨생물|무슨물고기|어떤물고기|뭐가살|뭐살|생물)/.test(q)){
      return listAnswer(question);
    }
    var best=null, bestScore=0;
    KB.forEach(function(item){
      var sc=0;
      item.kw.forEach(function(k){
        var nk=norm(k); if(nk && q.indexOf(nk)>=0) sc += Math.min(nk.length,6);
      });
      if(sc>0) sc += (item.boost||0);
      if(sc>bestScore){ bestScore=sc; best=item; }
    });
    if(best && bestScore>=2) return best;
    return { answer:"음… 그 질문은 제가 가진 온천천 자료로는 답하기 어려워요. 😅<br>온천천의 <b>생물</b>(예: 수달, 버들치, 다슬기)이나 <b>역사</b>(예: 국가하천 승격, 수질 개선)에 대해 물어봐 주세요.", nomatch:true };
  }

  /* 하이브리드: 엔드포인트 있으면 진짜 AI 시도 → 실패 시 지식기반 */
  function getAnswer(question){
    if(AI_CONFIG.endpoint){
      return fetch(AI_CONFIG.endpoint, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ question: question })
      }).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if(d && d.answer) return { answer: esc(d.answer).replace(/\n/g,"<br>") };
          return localAnswer(question);
        }).catch(function(){ return localAnswer(question); });
    }
    return Promise.resolve(localAnswer(question));
  }

  /* ---------- UI ---------- */
  var chat = document.getElementById('chat');
  function addMsg(who, html){
    var m = document.createElement('div');
    m.className = 'msg ' + who;
    m.innerHTML = '<div class="av">'+(who==='bot'?'🌿':'🙋')+'</div><div class="bubble">'+html+'</div>';
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
    return m;
  }
  function answerHtml(res){
    var html = res.answer;
    if(res.link) html += '<br><a class="golink" href="'+res.link.href+'">'+res.link.label+'</a>';
    return html;
  }
  function ask(question){
    question = (question||"").trim();
    if(!question) return;
    addMsg('me', esc(question));
    var typing = addMsg('bot', '<span class="typing"><span></span><span></span><span></span></span>');
    getAnswer(question).then(function(res){
      setTimeout(function(){
        typing.querySelector('.bubble').innerHTML = answerHtml(res);
        chat.scrollTop = chat.scrollHeight;
      }, 380);
    });
  }

  // 추천 질문 칩
  var SUGGESTS = ["수달은 어디에 살아?","온천천에 무슨 물고기가 있어?","국가하천 승격이 뭐야?","온천천 수질은 어때?","버들치 알려줘"];
  var sugWrap = document.getElementById('suggests');
  SUGGESTS.forEach(function(s){
    var b = document.createElement('button'); b.type='button'; b.textContent = s;
    b.addEventListener('click', function(){ ask(s); });
    sugWrap.appendChild(b);
  });

  document.getElementById('composer').addEventListener('submit', function(ev){
    ev.preventDefault();
    var input = document.getElementById('q');
    ask(input.value); input.value='';
  });

  // 첫 인사
  addMsg('bot', "안녕하세요! 저는 <b>온천천 AI 도우미</b>예요. 🌿<br>온천천의 수생생물과 역사에 대해 무엇이든 물어보세요. 아래 추천 질문을 눌러봐도 좋아요!");
</script>
