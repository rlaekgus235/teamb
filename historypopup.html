<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>부산 온천천의 역사</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:      #1A365D;   /* 아카이브 딥 */
    --brand:     #2C5282;
    --teal:      #2C7A7B;   /* 축·배지 강조 (원문 표지 톤) */
    --teal-soft: #C6E0DC;
    --bg:        #FBF7F0;
    --card:      #FFFFFF;
    --ink:       #24303F;
    --muted:     #6B7A8C;
    --line:      #DCE4EC;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", sans-serif;
    font-weight: 300;
    line-height: 1.7;
  }
  h1, h2, h3 { font-family: "Noto Serif KR", serif; }

  /* ── 히어로 ─────────────────────────────────────────────────── */
  .hero {
    background: linear-gradient(140deg, var(--deep) 0%, #1D4A52 55%, #2C7A7B 130%);
    color: #fff;
    padding: 74px 24px 68px;
    text-align: center;
  }
  .hero .kicker {
    font-size: 11.5px; letter-spacing: 0.34em; opacity: 0.8; margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(30px, 5vw, 48px); font-weight: 700; margin: 0 0 18px; letter-spacing: -0.01em;
  }
  .hero .wave { font-size: 17px; letter-spacing: 0.5em; opacity: 0.5; margin-bottom: 18px; }
  .hero p { margin: 0 auto; max-width: 520px; font-size: 15px; line-height: 1.9; opacity: 0.92; font-weight: 300; }
  .hero .range {
    display: inline-block; margin-top: 26px; font-size: 11.5px; letter-spacing: 0.2em;
    border: 1px solid rgba(255,255,255,0.35); border-radius: 20px; padding: 6px 18px; opacity: 0.9;
  }

  /* ── 상단 고정 헤더 (칩 + 전체 펼치기/접기) ─────────────────── */
  .bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,250,252,0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar-in {
    max-width: 1040px; margin: 0 auto; padding: 12px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .bar .brand {
    font-family: "Noto Serif KR", serif; font-weight: 700; font-size: 15px; color: var(--deep);
    white-space: nowrap;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; }
  .chip {
    font-family: inherit; font-size: 12.5px; font-weight: 400;
    color: var(--deep); background: #fff; border: 1px solid var(--line);
    border-radius: 20px; padding: 6px 13px; cursor: pointer; white-space: nowrap;
    transition: background .18s, border-color .18s, color .18s;
  }
  .chip .no { font-weight: 700; color: var(--teal); margin-right: 5px; }
  .chip:hover { background: #EDF5F4; border-color: var(--teal); }
  .chip.active { background: var(--deep); border-color: var(--deep); color: #fff; }
  .chip.active .no { color: #8FD3CB; }
  .tools { display: flex; gap: 6px; }
  .tool {
    font-family: inherit; font-size: 12.5px; color: #fff; background: var(--brand);
    border: 0; border-radius: 20px; padding: 7px 15px; cursor: pointer; white-space: nowrap;
    transition: background .18s;
  }
  .tool.ghost { background: #fff; color: var(--brand); border: 1px solid var(--line); }
  .tool:hover { background: var(--deep); color: #fff; }
  .tool.ghost:hover { border-color: var(--deep); }

  /* ── 타임라인 축 ────────────────────────────────────────────── */
  .timeline {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
    padding: 70px 24px 120px;
  }
  .timeline::before {                     /* 화면 중앙을 가로지르는 축 */
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
    width: 2px; transform: translateX(-50%);
    background: linear-gradient(180deg, transparent 0%, var(--line) 5%, var(--line) 95%, transparent 100%);
  }

  /* ── 시대 대분류 카드 ───────────────────────────────────────── */
  .era {
    position: relative; z-index: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 54px;
    box-shadow: 0 2px 4px rgba(26,54,93,0.04), 0 12px 28px rgba(26,54,93,0.07);
    scroll-margin-top: 84px;
    transition: box-shadow .25s, border-color .25s;
  }
  .era:last-child { margin-bottom: 0; }
  .era:hover { box-shadow: 0 3px 6px rgba(26,54,93,0.06), 0 16px 36px rgba(26,54,93,0.11); }
  .era.open { border-color: var(--teal-soft); }
  .era::before {                          /* 축 위의 마디 점 */
    content: ""; position: absolute; left: 50%; top: -34px; transform: translateX(-50%);
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--teal); z-index: 2;
  }
  .era:first-child::before { top: -40px; }

  .era-head {
    width: 100%; text-align: left; background: none; border: 0;
    font-family: inherit; color: inherit; cursor: pointer;
    padding: 28px 30px; display: flex; align-items: flex-start; gap: 20px;
  }
  .era-head .no {
    font-family: "Noto Serif KR", serif; font-size: clamp(26px, 3.2vw, 38px);
    font-weight: 700; color: var(--teal-soft); line-height: 1; flex: 0 0 auto; min-width: 54px;
  }
  .era.open .era-head .no { color: var(--teal); }
  .era-head .meta { flex: 1 1 auto; min-width: 0; }
  .era-head .label { font-size: 10.5px; letter-spacing: 0.24em; color: var(--teal); margin-bottom: 6px; }
  .era-head h2 { font-size: clamp(19px, 2.4vw, 25px); margin: 0 0 6px; color: var(--deep); font-weight: 700; }
  .era-head .period { font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 9px; }
  .era-head .summary { font-size: 13.5px; color: #55637A; line-height: 1.75; margin: 0; }
  .era-head .side { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .era-head .count {
    font-size: 11px; color: var(--muted); background: #F1F5F8;
    border-radius: 20px; padding: 3px 10px; white-space: nowrap;
  }
  .caret {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--brand); font-size: 13px;
    transition: transform .35s ease, background .2s, color .2s;
  }
  .era.open .caret { transform: rotate(180deg); background: var(--teal); color: #fff; border-color: var(--teal); }

  /* ── 아코디언 패널 ──────────────────────────────────────────── */
  .era-panel {
    height: 0; overflow: hidden;
    transition: height .5s cubic-bezier(.22,.7,.25,1);
  }
  .events {
    position: relative;
    padding: 4px 30px 30px 60px;
  }
  .events::before {                      /* 세부 사건이 따라 흐르는 궤적 */
    content: ""; position: absolute; left: 37px; top: 14px; bottom: 26px;
    width: 2px; background: var(--teal-soft);
  }

  /* ── 세부 사건 카드 ─────────────────────────────────────────── */
  .ev {
    position: relative;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(26,54,93,0.04), 0 6px 16px rgba(26,54,93,0.06);
    opacity: 0; transform: translateY(16px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.22,.7,.25,1);
  }
  .ev:last-child { margin-bottom: 0; }
  .era.open .ev {
    opacity: 1; transform: none;
    transition-delay: calc(var(--i) * 80ms);
  }
  .ev::before {                          /* 궤적 위의 점 */
    content: ""; position: absolute; left: -28px; top: 25px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #fff; border: 3px solid var(--teal);
  }
  .ev .badge {
    display: inline-block; font-size: 11.5px; font-weight: 500; letter-spacing: 0.03em;
    color: var(--teal); background: #EAF4F2; border: 1px solid #D3E8E4;
    border-radius: 20px; padding: 3px 12px; margin-bottom: 9px;
  }
  .ev h3 { font-size: clamp(15px, 1.7vw, 18.5px); margin: 0 0 10px; color: var(--deep); font-weight: 700; }
  .ev .desc { font-size: 14px; line-height: 1.85; color: #3E4B5C; margin: 0; word-break: keep-all; }
  .ev .meaning {
    margin-top: 14px; padding: 13px 16px;
    background: #F2F8F7; border-left: 3px solid var(--teal); border-radius: 0 8px 8px 0;
  }
  .ev .meaning .mlabel {
    font-size: 10.5px; letter-spacing: 0.18em; color: var(--teal); font-weight: 500; margin-bottom: 4px;
  }
  .ev .meaning p { margin: 0; font-size: 13.5px; line-height: 1.8; color: #2F4858; word-break: keep-all; }
  .ev .src { margin-top: 12px; font-size: 11px; color: #9AA7B5; letter-spacing: 0.04em; }

  footer {
    text-align: center; padding: 0 24px 70px; color: var(--muted); font-size: 12.5px;
  }
  footer .rule { width: 40px; height: 1px; background: var(--line); margin: 0 auto 18px; }

  /* ── 과거 → 현재 사진 비교 ──────────────────────────────────── */
  .compare {
    max-width: 1040px; margin: -40px auto 0; padding: 0 24px 10px; position: relative; z-index: 5;
  }
  .compare-quote {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 24px; font-family: "Noto Serif KR", serif; font-size: 15px; color: var(--deep);
    text-align: center; box-shadow: 0 8px 24px rgba(26,54,93,0.09); margin-bottom: 28px;
  }
  .compare-grid {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px;
  }
  .compare-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 4px 10px rgba(26,54,93,0.05), 0 14px 30px rgba(26,54,93,0.08);
  }
  .compare-card img { width: 100%; height: 240px; object-fit: cover; display: block; }
  .compare-card .cap { padding: 14px 18px 16px; }
  .compare-card .tag {
    display: inline-block; font-size: 10.5px; letter-spacing: 0.14em; font-weight: 500;
    border-radius: 20px; padding: 3px 11px; margin-bottom: 8px;
  }
  .compare-card.past .tag { color: #9C4221; background: #FCEBE3; }
  .compare-card.present .tag { color: var(--teal); background: #EAF4F2; }
  .compare-card h3 { margin: 0 0 4px; font-size: 15.5px; color: var(--deep); }
  .compare-card .period { font-size: 12px; color: var(--muted); }
  .compare-arrow {
    font-size: 22px; color: var(--teal); font-family: "Noto Serif KR", serif;
  }
  @media (max-width: 640px) {
    .compare-grid { grid-template-columns: 1fr; }
    .compare-arrow { justify-self: center; transform: rotate(90deg); }
  }

  /* ── 사건 카드 내 사진 ──────────────────────────────────────── */
  .ev-photo { margin-top: 14px; border-radius: 10px; overflow: hidden; }
  .ev-photo img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .ev-photo .photo-cap {
    font-size: 11.5px; color: var(--muted); padding: 8px 2px 0; letter-spacing: 0.02em;
  }

  @media (max-width: 700px) {
    .timeline { padding: 54px 16px 90px; }
    .timeline::before { left: 22px; }
    .era::before { left: 22px; }
    .era-head { padding: 22px 20px; gap: 14px; }
    .era-head .no { min-width: 40px; }
    .events { padding: 4px 18px 24px 46px; }
    .events::before { left: 25px; }
    .ev { padding: 17px 18px; }
    .ev::before { left: -26px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="kicker">BUSAN · ONCHEON STREAM / HISTORY TIMELINE</div>
  <h1>부산 온천천의 역사</h1>
  <div class="wave">∿ ∿ ∿ ∿ ∿</div>
  <p>관광지 개발에서 도시화의 상처를 지나<br>시민과 자연이 함께 만든 생태 복원의 기록</p>
  <div class="range">고대 &mdash; 2024년 이후</div>
</header>

<div class="compare">
  <div class="compare-quote">"한때 외면받던 물길은 시민의 기억과 참여를 통해 다시 살아났습니다."</div>
  <div class="compare-grid">
    <div class="compare-card past">
      <img src="images/history/past-1980s.png" alt="1980~1990년대 오염과 악취의 온천천">
      <div class="cap">
        <span class="tag">PAST</span>
        <h3>오염과 악취의 온천천</h3>
        <div class="period">1980~1990년대</div>
      </div>
    </div>
    <div class="compare-arrow">→</div>
    <div class="compare-card present">
      <img src="images/history/present-cherry.png" alt="벚꽃과 축제가 함께하는 생태공원, 현재">
      <div class="cap">
        <span class="tag">PRESENT</span>
        <h3>벚꽃과 축제가 함께하는 생태공원</h3>
        <div class="period">현재</div>
      </div>
    </div>
  </div>
</div>

<nav class="bar">
  <div class="bar-in">
    <div class="brand">부산 온천천의 역사</div>
    <div class="chips" id="chips"></div>
    <div class="tools">
      <button class="tool" id="expandAll">전체 펼치기</button>
      <button class="tool ghost" id="collapseAll">전체 접기</button>
    </div>
  </div>
</nav>

<main class="timeline" id="timeline"></main>

<footer>
  <div class="rule"></div>
  출처 · 온천천 역사 기록 「부산 온천천의 역사」
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   역사 데이터 — 「수정된 온천천 역사 PDF - 최종본」 6개 대분류 · 16개 사건
   각 사건의 meaning 은 원문 설명의 '역사적 의미' 문장을 그대로 옮긴 것입니다.
   ═══════════════════════════════════════════════════════════════ */
const ERAS = [
  {
    no: '00', id: 'era00',
    title: '전통과 자연의 시대',
    period: '고대~19세기 · 조선 시대',
    summary: '제방과 콘크리트 이전, 자연 지형의 흐름에 기대어 지역의 생활과 농업을 지탱하던 물길의 시간이다.',
    events: [
      {
        tag: '고대~19세기',
        title: '자연 하천, 마을의 삶',
        desc: '오늘날의 온천천은 금정산에서 발원하여 동래 일대를 지나 수영강으로 이어지는 물길로, 오랜 세월 지역의 생활과 농업을 지탱한 자연 하천이었다. 계절에 따라 물길과 모래톱의 모습이 달라졌고, 주변의 들과 습지는 다양한 생물이 머무는 공간이자 주민들이 물을 얻고 농사를 짓던 생활 기반이었다.',
        meaning: '인공 시설이 개입하기 이전, 온천천이 계절에 따라 스스로 모습을 바꾸며 생물과 주민의 삶을 함께 품고 있던 원형의 상태를 보여준다.'
      },
      {
        tag: '조선 시대',
        title: '동래의 온천과 지역 공동체',
        desc: '온천천 주변은 동래 온천과 읍성, 마을길이 연결된 생활권으로 기능하였다. 온천을 찾는 사람과 인근 주민의 왕래가 이어졌지만, 하천 자체는 제방과 콘크리트 시설보다 자연 지형의 흐름에 의존하는 공간이었다.',
        meaning: '마을 공동체는 물길을 함께 이용하고 논밭과 둑을 돌보며 홍수와 가뭄에 대응하는 관계를 형성한 것이 특징이다.'
      }
    ]
  },
  {
    no: '01', id: 'era01',
    title: '식민지 근대화',
    period: '1907 — 1932',
    summary: '온천장 개발과 관광지화, 그리고 첫 근대식 제방 축조로 하천 이용 방식이 근본적으로 바뀐 시기이다.',
    events: [
      {
        tag: '1907~1930년대',
        title: '온천장 개발, 관광지화',
        desc: '1907년 일본인 온천장 거주자 6호에서 1931년 100여 호로 약 16배 증가하며 급격한 개발이 이루어졌다. 일본인들에 의한 토지조사사업으로 하천 주변 토지가 점진적으로 점유되었으며, 숙박업소, 요식업소, 별장 등이 들어서면서 전통 마을 공간이 식민지 근대 관광지로 완전히 재편되었다.',
        meaning: '이는 온천천 개발의 첫 출발점이자 하천 이용 방식의 근본적 변화를 의미하는 것이다.'
      },
      {
        tag: '1932',
        title: '첫 근대식 제방 축조',
        desc: '1932년 치수 목적의 첫 근대식 제방 축조가 완료되었다.',
        meaning: '이는 자연 하천에 대한 최초의 대규모 인공 개입으로서, 이후 직강화와 복개로 이어지는 도시하천화의 출발점이 되었다.'
      }
    ]
  },
  {
    no: '02', id: 'era02',
    title: '급속 도시화와 생태계 붕괴',
    period: '1970 — 1996',
    summary: '치수 중심 정책과 지류 복개가 이어지며 생태계가 완전히 소멸해 ‘죽은 하천’에 이른 시기이다.',
    events: [
      {
        tag: '1970~1980년대',
        title: '치수 중심, 생태 훼손 본격화',
        desc: '1970년대부터 1980년대에 걸쳐 제방 축조와 콘크리트 라이닝에 집중한 치수 및 토지 활용 위주의 정책이 추진되면서 수질 오염과 생태계 훼손이 급격히 진행되었다. 1983년 수영하수처리장 건설로 하수관로 정비가 추진되어 일부 개선이 이루어졌으나, 전반적인 오염 심화는 계속되었다.',
        meaning: '이 시기는 생태계 훼손이 본격화되어 이후 복원사업의 필요성을 대두하게 만든 중요한 전환점이다.'
      },
      {

/* ═══════════════════════════════════════════════════════════════
   렌더링
   ═══════════════════════════════════════════════════════════════ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const timeline = document.getElementById('timeline');
const chips    = document.getElementById('chips');

timeline.innerHTML = ERAS.map(era => `
  <section class="era" id="${era.id}">
    <button class="era-head" type="button" aria-expanded="false" aria-controls="${era.id}-panel">
      <span class="no">${era.no}</span>
      <span class="meta">
        <span class="label">${era.no} / HISTORY</span>
        <h2>${esc(era.title)}</h2>
        <div class="period">${esc(era.period)}</div>
        <p class="summary">${esc(era.summary)}</p>
      </span>
      <span class="side">
        <span class="count">사건 ${era.events.length}</span>
        <span class="caret">▾</span>
      </span>
    </button>
    <div class="era-panel" id="${era.id}-panel">
      <div class="events">
        ${era.events.map((ev, i) => `
          <article class="ev" style="--i:${i}">
            <span class="badge">${esc(ev.tag)}</span>
            <h3>${esc(ev.title)}</h3>
            <p class="desc">${esc(ev.desc)}</p>
            <div class="meaning">
              <div class="mlabel">역사적 의미</div>
              <p>${esc(ev.meaning)}</p>
            </div>
            ${ev.photo ? `
            <div class="ev-photo">
              <img src="${ev.photo}" alt="${esc(ev.photoCaption || '')}" loading="lazy">
              <div class="photo-cap">${esc(ev.photoCaption || '')}</div>
            </div>` : ''}
            <div class="src">온천천 역사 기록</div>
          </article>`).join('')}
      </div>
    </div>
  </section>`).join('');

chips.innerHTML = ERAS.map(era =>
  `<button class="chip" type="button" data-target="${era.id}"><span class="no">${era.no}</span>${esc(era.title)}</button>`
).join('');

/* ═══════════════════════════════════════════════════════════════
   아코디언 열림/닫힘
   ═══════════════════════════════════════════════════════════════ */
function setOpen(era, open) {
  const panel = era.querySelector('.era-panel');
  const head  = era.querySelector('.era-head');
  const inner = era.querySelector('.events');

  if (open === era.classList.contains('open')) return;

  // 진행 중이던 전환의 리스너가 남아 다음 동작을 되돌리지 않도록 먼저 정리
  if (panel._onEnd) {
    panel.removeEventListener('transitionend', panel._onEnd);
    panel._onEnd = null;
  }

  era.classList.toggle('open', open);
  head.setAttribute('aria-expanded', String(open));

  // 현재 높이(auto 포함)를 실측해 고정한 뒤 목표 높이로 전환
  panel.style.height = panel.getBoundingClientRect().height + 'px';
  void panel.offsetHeight;                             // 리플로우 강제
  panel.style.height = (open ? inner.offsetHeight : 0) + 'px';

  const onEnd = e => {
    if (e.target !== panel || e.propertyName !== 'height') return;   // 자식 전환의 버블링 무시
    if (era.classList.contains('open')) panel.style.height = 'auto'; // 열린 상태일 때만 auto
    panel.removeEventListener('transitionend', onEnd);
    panel._onEnd = null;
  };
  panel._onEnd = onEnd;
  panel.addEventListener('transitionend', onEnd);
}

document.querySelectorAll('.era').forEach(era => {
  era.querySelector('.era-head').addEventListener('click', () => {
    setOpen(era, !era.classList.contains('open'));
  });
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('.era').forEach(era => setOpen(era, true));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.era').forEach(era => setOpen(era, false));
});

/* 칩 → 해당 시대로 이동하며 펼치기 */
chips.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  const era = document.getElementById(btn.dataset.target);
  const go = () => era.scrollIntoView({ behavior: 'smooth', block: 'start' });

  setOpen(era, true);
  go();                  // 즉시 이동해 반응을 보여주고
  setTimeout(go, 540);   // 펼침이 끝나 문서 높이가 확정된 뒤 위치를 보정한다
});

/* 스크롤 위치에 따라 현재 시대 칩 표시 */
const chipMap = {};
document.querySelectorAll('.chip').forEach(c => chipMap[c.dataset.target] = c);
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chipMap[en.target.id]?.classList.add('active');
  });
}, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
document.querySelectorAll('.era').forEach(era => io.observe(era));

/* 첫 시대는 열어 둔 채로 시작 */
setOpen(document.getElementById('era00'), true);
</script>
