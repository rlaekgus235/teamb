<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>온천천의 시간 — 상세</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="history-data.js"></script>
<style>
  :root {
    --clay: #a5836e; --teal: #2e9e8f; --blue: #2f6f9e;
    --ink: #1e3a52; --brand-brown: #4a2c15;
    --serif: "Noto Serif KR", serif;
    --body-font: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    --accent: var(--clay);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body-font); color: var(--ink);
    background: linear-gradient(to bottom, #eaf3f4 0%, #f2f5f0 45%, #f5f1e9 100%);
  }

  /* ===== 상단 메뉴바 ===== */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    padding: 15px 40px;
    background: rgba(242,245,240,0.9);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(30,58,82,0.10);
  }
  .topbar .brand {
    color: var(--brand-brown); text-decoration: none; font-family: var(--serif);
    font-size: 17px; letter-spacing: 4px; font-weight: 700;
  }
  .topbar .brand .en {
    display: block; font-size: 10px; letter-spacing: 3px;
    opacity: 0.7; margin-top: 3px; font-family: sans-serif; font-weight: 400;
  }
  .nav-menu { display: flex; gap: 30px; }
  .nav-menu a {
    color: #fff; text-decoration: none; font-family: var(--serif);
    font-size: 15px; letter-spacing: 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5), 0 0 8px rgba(0,0,0,0.35);
    position: relative; padding: 4px 2px; transition: color .25s;
  }
  .nav-menu a::after {
    content: ""; position: absolute; left: 0; bottom: -3px;
    width: 0; height: 2px; background: var(--teal); transition: width .3s ease;
  }
  .nav-menu a:hover { color: var(--ink); }
  .nav-menu a:hover::after, .nav-menu a.active::after { width: 100%; }
  .nav-menu a.active { color: var(--teal); font-weight: 700; }

  /* ===== 상세 히어로 이미지 ===== */
  .d-hero {
    position: relative; width: 100%; height: 440px; min-height: 340px;
    overflow: hidden; background: #24303a;
  }
  .d-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-hero .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(10,20,30,0.15) 0%, rgba(10,20,30,0.05) 45%, rgba(10,20,30,0.78) 100%);
  }
  .d-hero .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 900px; margin: 0 auto; padding: 0 32px 40px; color: #fff;
  }
  .d-hero .phase-tag {
    display: inline-block; font-size: 12px; font-weight: bold; letter-spacing: 2px;
    padding: 6px 14px; border-radius: 20px; margin-bottom: 16px;
    background: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .d-hero .yr {
    font-family: var(--serif); font-weight: 700;
    font-size: clamp(30px, 5vw, 52px); margin: 0 0 8px; letter-spacing: 1px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }
  .d-hero .ttl {
    font-family: var(--serif); font-weight: 500;
    font-size: clamp(17px, 2.4vw, 24px); margin: 0; line-height: 1.4;
    text-shadow: 0 1px 12px rgba(0,0,0,0.5);
  }

  /* ===== 본문 ===== */
  .d-body { max-width: 760px; margin: 0 auto; padding: 44px 32px 20px; }
  .d-back {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #5a7080; text-decoration: none; margin-bottom: 22px;
  }
  .d-back:hover { color: var(--accent); }
  .d-content { font-size: 15.5px; line-height: 2; color: #33434f; }

  .d-stats { margin: 24px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .d-stats .stat {
    font-size: 12.5px; font-weight: bold; color: var(--ink);
    background: #fff; border: 1px solid #e3eae4; border-radius: 6px; padding: 6px 12px;
    box-shadow: 0 2px 6px rgba(30,58,82,0.06);
  }

  .d-meaning {
    margin-top: 26px; padding: 18px 20px;
    background: #fff; border-left: 5px solid var(--accent); border-radius: 0 10px 10px 0;
    box-shadow: 0 3px 14px rgba(30,58,82,0.08);
  }
  .d-meaning .label {
    display: block; font-weight: bold; font-size: 12px;
    color: var(--accent); margin-bottom: 6px; letter-spacing: 2px;
  }
  .d-meaning p { margin: 0; font-size: 14px; line-height: 1.85; color: #3a4a58; }

  .d-imgnote { margin-top: 18px; font-size: 11.5px; color: #98a4ac; line-height: 1.6; }

  /* ===== 이전/다음 ===== */
  .pager {
    max-width: 760px; margin: 30px auto 0; padding: 0 32px;
    display: flex; gap: 12px; justify-content: space-between;
  }
  .pager a, .pager span {
    flex: 1; min-width: 0; text-decoration: none;
    background: #fff; border: 1px solid #e3eae4; border-radius: 10px;
    padding: 14px 16px; box-shadow: 0 2px 8px rgba(30,58,82,0.06);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .pager a:hover { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(30,58,82,0.12); }
  .pager .dir { font-size: 11px; color: #9aa7af; letter-spacing: 1px; }
  .pager .name { font-family: var(--serif); font-size: 13.5px; color: var(--ink); margin-top: 4px; display: block; line-height: 1.4; }
  .pager .next { text-align: right; }
  .pager .disabled { opacity: 0.4; pointer-events: none; }

  .to-list {
    display: block; text-align: center; margin: 34px auto 0;
    font-family: var(--serif); font-size: 14px; color: var(--teal); text-decoration: none;
  }
  .to-list:hover { text-decoration: underline; }

  footer.src {
    background: var(--ink); color: #cfe0ee;
    font-size: 12px; line-height: 1.8; text-align: center; padding: 30px 40px; margin-top: 50px;
  }

  .p-clay { --accent: var(--clay); }
  .p-teal { --accent: var(--teal); }
  .p-blue { --accent: var(--blue); }

  @media (max-width: 760px) {
    .topbar { padding: 12px 20px; flex-wrap: wrap; gap: 8px; }
    .topbar .brand { font-size: 14px; letter-spacing: 2px; }
    .nav-menu { gap: 15px; }
    .nav-menu a { font-size: 12px; letter-spacing: 1px; }
    .d-hero { height: 320px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    온천천 아카이브
    <span class="en">ONCHEONCHEON ARCHIVE</span>
  </a>
  <nav class="nav-menu">
    <a href="온천천의_역사.html" class="active">역사</a>
    <a href="storymap.html">지도</a>
    <a href="온천천%20아카이브.html">안내책자</a>
    <a href="온천천의_수생생물.html">수생생물</a>
    <a href="온천천의_시민참여.html">시민 참여</a>
    <a href="온천천의_AI질문.html">AI에게 질문</a>
  </nav>
</header>

<main id="app"></main>

<footer class="src">
  본 자료는 공개된 뉴스보도·지자체 발표자료·나무위키 등을 바탕으로 재정리한 디지털 인문학 연구용 데이터입니다.<br>
  일부 세부 연도(특히 일제강점기 개별 공사 시점)는 1차 사료 대조가 추가로 필요할 수 있습니다.
</footer>

<script>
  var events = window.ONCHEON_HISTORY || [];
  var phaseName = { clay: "개발·훼손기", teal: "복원운동기", blue: "회복·제도화기" };

  function getIndex() {
    var m = /[?&]e=(\d+)/.exec(location.search);
    var i = m ? parseInt(m[1], 10) : 0;
    if (isNaN(i) || i < 0 || i >= events.length) i = 0;
    return i;
  }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function pagerCard(idx, dir, cls) {
    if (idx < 0 || idx >= events.length) {
      return '<span class="disabled ' + cls + '"><span class="dir">' + dir + '</span>' +
             '<span class="name">—</span></span>';
    }
    var e = events[idx];
    return '<a class="' + cls + '" href="온천천의_역사_상세.html?e=' + idx + '">' +
             '<span class="dir">' + dir + '</span>' +
             '<span class="name">' + esc(e.year) + ' · ' + esc(e.title) + '</span>' +
           '</a>';
  }

  function render() {
    var i = getIndex();
    var e = events[i];
    document.title = '온천천의 시간 — ' + e.year + ' ' + e.title;

    var statsHtml = '';
    if (e.stats && e.stats.length) {
      statsHtml = '<div class="d-stats">' +
        e.stats.map(function (s) { return '<span class="stat">' + esc(s) + '</span>'; }).join('') +
        '</div>';
    }

    document.getElementById('app').className = 'p-' + e.phase;
    document.getElementById('app').innerHTML =
      '<section class="d-hero">' +
        '<img src="' + e.img + '" alt="' + esc(e.title) + ' 관련 이미지">' +
        '<div class="scrim"></div>' +
        '<div class="cap">' +
          '<span class="phase-tag">' + phaseName[e.phase] + '</span>' +
          '<h1 class="yr">' + esc(e.year) + '</h1>' +
          '<p class="ttl">' + esc(e.title) + '</p>' +
        '</div>' +
      '</section>' +
      '<div class="d-body">' +
        '<a class="d-back" href="온천천의_역사.html">← 전체 타임라인으로</a>' +
        '<div class="d-content">' + esc(e.content) + '</div>' +
        statsHtml +
        '<div class="d-meaning"><span class="label">역사적 의미</span><p>' + esc(e.meaning) + '</p></div>' +
        '<p class="d-imgnote">※ 상단 이미지는 실제 당시 사진이 아니라, 온천천의 사진을 각 시기(국면) 색으로 톤 처리해 재구성한 해석용 이미지입니다.</p>' +
      '</div>' +
      '<div class="pager">' +
        pagerCard(i - 1, '◀ 이전', 'prev') +
        pagerCard(i + 1, '다음 ▶', 'next') +
      '</div>' +
      '<a class="to-list" href="온천천의_역사.html">전체 12장면 타임라인 보기</a>';

    window.scrollTo(0, 0);
  }

  render();
</script>
</body>
</html>
