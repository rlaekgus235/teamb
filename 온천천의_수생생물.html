<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>온천천의 수생생물</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --accent: #d94a3d; --leaf: #2e9e8f; --brand-brown: #4a2c15; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #eef3ec;
    color: #17324a;
  }

  /* ===== 상단 메뉴바 ===== */
  .topbar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 4;
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 40px;
  }
  .topbar .brand {
    color: var(--brand-brown); text-decoration: none;
    font-family: "Noto Serif KR", serif;
    font-size: 17px; letter-spacing: 4px; font-weight: 700;
    text-shadow: 0 1px 2px rgba(255,255,255,0.9), 0 0 12px rgba(255,255,255,0.6);
  }
  .topbar .brand .en {
    display: block; font-size: 11px; letter-spacing: 3px;
    opacity: 0.75; margin-top: 4px; font-family: sans-serif; font-weight: 400;
  }
  .nav-menu { display: flex; gap: 34px; }
  .nav-menu a {
    color: #fff; text-decoration: none;
    font-family: "Noto Serif KR", serif; font-size: 15px; letter-spacing: 2px;
    position: relative; padding: 4px 2px; opacity: 0.9;
    text-shadow: 0 1px 8px rgba(0,0,0,0.45); transition: opacity .25s;
  }
  .nav-menu a::after {
    content: ""; position: absolute; left: 0; bottom: -3px;
    width: 0; height: 2px; background: var(--accent); transition: width .3s ease;
  }
  .nav-menu a:hover { opacity: 1; }
  .nav-menu a:hover::after, .nav-menu a.active::after { width: 100%; }

  /* ===== 자연 타이틀 헤더 ===== */
  .page-hero {
    position: relative; height: 440px; min-height: 380px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: "Noto Serif KR", serif;
  }
  .ph-bg {
    position: absolute; inset: 0;
    background: url("images/oncheon-header.jpg") center 40%/cover no-repeat;
    transform: scale(1.05);
    animation: phZoom 18s ease-out forwards;
  }
  @keyframes phZoom { from { transform: scale(1.12); } to { transform: scale(1.02); } }
  .ph-overlay {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(20,52,42,0.55) 0%,
        rgba(22,58,44,0.42) 40%,
        rgba(16,40,32,0.72) 100%);
  }
  .ph-content { position: relative; z-index: 3; color: #fff; padding: 40px 24px 0; }
  .ph-kicker {
    font-family: sans-serif; font-size: 12px; letter-spacing: 6px;
    color: #d7ede2; opacity: 0.92; margin-bottom: 18px;
    opacity: 0; transform: translateY(16px); animation: phRise 1.1s ease 0.2s forwards;
  }
  .ph-title {
    font-size: clamp(30px, 5vw, 52px); font-weight: 700; letter-spacing: 3px;
    margin: 0 0 18px; text-shadow: 0 2px 22px rgba(0,0,0,0.45);
    opacity: 0; transform: translateY(20px); animation: phRise 1.1s ease 0.4s forwards;
  }
  .ph-title .leaf { color: #b9e7c8; }
  .ph-sub {
    font-family: "Malgun Gothic", sans-serif;
    font-size: clamp(13px, 1.6vw, 16px); letter-spacing: 1px; line-height: 1.7;
    color: rgba(255,255,255,0.94); text-shadow: 0 1px 12px rgba(0,0,0,0.4);
    margin: 0; opacity: 0; transform: translateY(20px); animation: phRise 1.1s ease 0.65s forwards;
  }
  @keyframes phRise { to { opacity: 1; transform: translateY(0); } }
  .ph-wave {
    position: absolute; left: 0; right: 0; bottom: -1px; z-index: 3; display: block;
  }

  /* 떨어지는 꽃잎 */
  .petals { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .petal { position: absolute; top: -8%; animation: petalFall linear infinite; }
  .petal > i {
    display: block; border-radius: 150% 0 150% 0;
    box-shadow: inset 0 0 3px rgba(255,255,255,0.45);
    animation: petalSway ease-in-out infinite alternate;
  }
  @keyframes petalFall {
    0% { transform: translateY(-10vh); opacity: 0; }
    8% { opacity: 0.95; }
    100% { transform: translateY(112vh); opacity: 0.9; }
  }
  @keyframes petalSway {
    from { transform: translateX(-13px) rotate(0deg); }
    to   { transform: translateX(15px) rotate(360deg); }
  }
  @media (max-width: 640px) {
    .topbar { padding: 16px 20px; flex-wrap: wrap; gap: 10px; }
    .topbar .brand { font-size: 13px; letter-spacing: 2px; }
    .nav-menu { gap: 15px; }
    .nav-menu a { font-size: 12px; letter-spacing: 1px; }
    .page-hero { height: 380px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ph-bg, .ph-kicker, .ph-title, .ph-sub { animation: none; opacity: 1; transform: none; }
    .petals { display: none; }
  }

  /* ===== 분류 그룹 탭 (가로 나열) ===== */
  .group-tabs {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px; max-width: 1000px; margin: 18px auto 0; padding: 0 24px;
  }
  .group-tab {
    display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none; font-family: inherit;
    padding: 12px 18px; border-radius: 999px;
    background: #fff; box-shadow: 0 2px 8px rgba(23,50,72,0.08);
    border: 1px solid #e3ede8;
    transition: box-shadow .2s ease, border-color .2s ease, background .2s ease;
  }
  .group-tab:hover { box-shadow: 0 4px 14px rgba(46,158,143,0.18); border-color: #bfe4da; }
  .group-tab .gt-main {
    font-size: 15px; font-weight: bold; color: #2e9e8f; letter-spacing: 1px;
  }
  .group-tab .gt-desc { color: #90a4b4; font-weight: normal; font-size: 11.5px; }
  .group-tab .gt-count {
    font-size: 11px; font-weight: bold; color: #2e9e8f; background: #e5f4f1;
    border-radius: 10px; padding: 2px 9px;
  }
  .group-tab.active { border-color: #2e9e8f; background: #f2faf8; }
  .group-tab.active .gt-main { color: #17324a; }

  /* 선택된 그룹의 원형 목록 패널 (하나만 표시) */
  .group-panels { max-width: 1000px; margin: 0 auto; padding: 0 24px; }
  .group-panel-item { display: none; }
  .group-panel-item.active { display: block; }

  .scroll-hint {
    font-size: 11px; color: #8ea2ac; text-align: right;
    padding: 10px 6px 0; letter-spacing: 0.5px;
  }

  /* ===== 원형 아이콘 선택 바 (가로 한 줄, 옆으로 스크롤) ===== */
  .picker {
    display: flex;
    flex-wrap: nowrap;
    align-items: flex-start;
    gap: 22px 24px;
    padding: 14px 6px 18px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .picker::-webkit-scrollbar { height: 8px; }
  .picker::-webkit-scrollbar-track { background: #eef3ec; border-radius: 4px; }
  .picker::-webkit-scrollbar-thumb { background: #bfe0d6; border-radius: 4px; }
  .picker::-webkit-scrollbar-thumb:hover { background: #2e9e8f; }

  .picker .item {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    width: 108px;
    scroll-snap-align: start;
  }
  .picker .circle {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid transparent;
    background: #dfe6ee;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .picker .circle img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  /* 이미지가 아직 없을 때 이모지 자리표시 */
  .picker .circle .emoji { font-size: 40px; }
  .picker .item:hover .circle { transform: translateY(-4px) scale(1.04); }
  .picker .item.active .circle {
    border-color: #2e9e8f;
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 4px 14px rgba(46,158,143,0.5);
  }
  .picker .label {
    margin-top: 10px;
    font-size: 13px;
    font-weight: bold;
    color: #17324a;
    text-align: center;
    line-height: 1.3;
  }
  .picker .item.active .label { color: #2e9e8f; }
  .picker .tagline {
    margin-top: 3px;
    font-size: 10.5px;
    color: #6d8a84;
    text-align: center;
    line-height: 1.35;
    max-width: 100px;
  }

  /* ===== 상세 카드 영역 ===== */
  .detail-wrap {
    max-width: 860px;
    margin: 24px auto 60px;
    padding: 0 24px;
  }
  .detail {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.12);
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .detail.show { opacity: 1; transform: translateY(0); }

  .detail .photo {
    width: 100%;
    height: 340px;
    background: #dfe6ee;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .detail .photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail .photo .emoji { font-size: 120px; }

  .detail .body { padding: 28px 30px 32px; }
  .detail .body h2 { margin: 0 0 6px; font-size: 24px; color: #17324a; }
  .detail .badge {
    display: inline-block; font-size: 11px; font-weight: bold;
    color: #2e9e8f; background: #e5f4f1; border-radius: 4px;
    padding: 3px 9px; margin: 0 0 10px 8px; vertical-align: middle;
  }
  .detail .sci {
    display: inline-block;
    font-size: 12px; color: #557;
    background: #eef2f6; border-radius: 4px;
    padding: 3px 9px; margin-bottom: 16px;
  }
  .detail .sci i { font-style: italic; }
  .detail .desc {
    font-size: 15px; line-height: 1.9; color: #333;
    white-space: pre-line;
    margin-bottom: 6px;
  }

  /* ===== 소리로 듣는 설명 ===== */
  .audio-block {
    display: flex; align-items: center; gap: 10px;
    margin-top: 22px; padding: 11px 14px;
    background: #eef6f4; border: 1px solid #dcebe7; border-radius: 12px;
  }
  .audio-block .audio-ic { font-size: 20px; }
  .audio-block .audio-txt { font-size: 13px; font-weight: bold; color: #17324a; white-space: nowrap; }
  .audio-block audio { flex: 1; height: 36px; min-width: 0; }

  /* ===== 지도 + 영상 2단 배치 ===== */
  .media-row {
    display: flex; flex-wrap: wrap; gap: 22px;
    margin-top: 20px; padding-top: 20px;
    border-top: 1px dashed #d8dfe6;
  }
  .media-col { flex: 1 1 240px; min-width: 0; }
  .col-title { font-size: 14px; font-weight: bold; color: #17324a; margin: 0 0 4px; }
  .habitat-sub { font-size: 12px; color: #5a7184; line-height: 1.6; margin-bottom: 14px; }
  .habitat-sub b { color: #2e9e8f; }

  .mapbox { width: 176px; margin: 0 auto; text-align: center; }
  .mapbox .rt, .mapbox .rb { font-size: 10px; color: #9bb0bf; letter-spacing: 2px; }
  .mapbox .rt { margin-bottom: 6px; }
  .mapbox .rb { margin-top: 6px; }
  .mapinner {
    position: relative; width: 150px; margin: 0 auto;
    background: #f7fbfa; border: 1px solid #e6efeb;
    border-radius: 10px; padding: 0; line-height: 0;
    overflow: hidden;
  }
  .mapinner img { width: 100%; display: block; }
  .mapinner .spot {
    position: absolute;
    border-radius: 50%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(64,190,138,0.9) 0%,
      rgba(64,190,138,0.45) 42%,
      rgba(64,190,138,0) 72%);
    animation: habitatPulse 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes habitatPulse {
    0%, 100% { opacity: 0.12; transform: translate(-50%, -50%) scale(0.78); }
    50%      { opacity: 0.95; transform: translate(-50%, -50%) scale(1.08); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mapinner .spot { animation: none; opacity: 0.7; }
  }

  .videobox {
    width: 100%; border-radius: 12px; overflow: hidden;
    background: #000; box-shadow: 0 3px 12px rgba(0,0,0,0.16);
  }
  .videobox video { width: 100%; height: auto; display: block; }
  .video-cap { font-size: 11px; color: #8494a1; line-height: 1.5; margin-top: 8px; }

  @media (max-width: 600px) {
    .media-col { flex-basis: 100%; }
  }

  footer.outro {
    padding: 30px 40px; background: #17324a;
    color: #cfe0ee; font-size: 12px; text-align: center; line-height: 1.8;
  }

  @media (max-width: 600px) {
    .detail .photo { height: 220px; }
    .picker .circle { width: 78px; height: 78px; }
    .picker .item { width: 92px; }
  }
</style>
</head>

<script>
  /* =========================================================
     수생생물 데이터 — 『부산 온천천의 생물』(부산광역시 보건환경연구원)
     - id       : 고유 구분값
     - name     : 이름 (국문)
     - sci      : 학명 · 분류
     - group    : 분류 묶음 (어류 / 저서동물 / 조류 / 기타 생물)
     - emoji    : 사진이 없을 때 임시로 보여줄 이모지
     - thumb    : 원형 썸네일 이미지 경로
     - photo    : 상세 큰 사진 경로
     - desc     : 소개 글 (줄바꿈은 \n)
     ========================================================= */
  var creatures = [
    // ── 어류 ──
    {
      id: "beodeulchi", group: "어류", name: "버들치", tag: "상류 계곡을 접수한 텃세 만렙 소형어",
      sci: "<i>Moroco oxycephalus</i> · 잉어목 잉어과 황어아과", emoji: "🐟",
      thumb: "images/creatures/beodeulchi.jpg", photo: "images/creatures/beodeulchi.jpg",
      desc: "온천천 최상류에서 구서역 인근까지 넓게 분포합니다. 상류로 갈수록 개체수가 크게 늘어 범어사 인근 계곡에서는 대부분의 어류가 버들치였으며, 중류로 갈수록 출현빈도가 뚝 떨어집니다. 맑은 물에 사는 어류로 알려져 있지만 약간 오염된 수역에서도 관찰됩니다.\n약 8~15cm까지 자라고 입수염이 없으며, 아래턱이 위턱보다 조금 짧습니다. 부착조류·식물의 종자·수서곤충 등을 먹고 살며, 산란기는 4~6월로 유속이 느린 여울에 알을 낳습니다."
    },
    {
      id: "chamgalgeoni", group: "어류", name: "참갈겨니", tag: "혼인철엔 얼굴에 하얀 뾰루지 '추성'이 뿅!",
      sci: "<i>Zacco koreanus</i> · 잉어목 잉어과 피라미아과", emoji: "🐟",
      thumb: "images/creatures/chamgalgeoni.jpg", photo: "images/creatures/chamgalgeoni.jpg",
      desc: "온천천 상류부터 장전역 인근까지 풍부하게 서식합니다. 최상류 계곡에서는 거의 보이지 않으나 청룡2호교 인근부터 개체수가 늘어 남산공영주차장~장전역 구간에서 아주 흔합니다. 13~20cm까지 자라며 물이 맑은 하천에서 수서곤충을 먹습니다.\n수컷은 산란기(5~8월)에 붉고 화려한 혼인색으로 변하고 눈과 입 주위에 '추성'이라는 하얀 돌기가 생깁니다. 갈겨니와 닮았지만, 갈겨니는 눈동자 위가 충혈되듯 붉고 참갈겨니는 그렇지 않습니다."
    },
    {
      id: "dongsari", group: "어류", name: "동사리", tag: "밤에만 출근하는 '구구송' 야행성 가수",
      sci: "<i>Odontobutis platycephala</i> · 농어목 동사리과", emoji: "🐟",
      thumb: "images/creatures/dongsari.jpg", photo: "images/creatures/dongsari.jpg",
      desc: "온천천 상류의 바위와 자갈이 많은 계곡에 주로 살며 간혹 금정구청 인근 중류에서도 보입니다. 야행성으로 낮에는 돌 밑에 숨어 있다가 밤에 수서곤충·갑각류·작은 어류를 잡아먹으며 약 10~15cm까지 자랍니다.\n수컷은 자기 영역에서 텃세를 부리고 암컷이 알을 낳으면 그 알을 지킵니다. 산란기에는 '구구, 구구' 하는 소리를 내며, 주변 환경에 따라 짙은 갈색에서 옅은 갈색까지 변하는 한국 고유종입니다."
    },
    {

  pickerRoot.appendChild(panelsWrap);

  var groupPanels = {};

      '<span class="gt-count">' + members.length + '종</span>';

    groupTabs[g] = tabBtn;

    panel.className = 'group-panel-item';

    hint.className = 'scroll-hint';
    hint.textContent = '옆으로 스크롤해서 더 보기 →';
    panel.appendChild(hint);

    row.className = 'picker';

      item.className = 'item';
      item.dataset.id = c.id;

        '<div class="tagline">' + (c.tag || '') + '</div>';

    var mapCol = '';
    if (hb) {
      mapCol =
        '<div class="media-col media-left">' +
          '<div class="col-title">🗺️ 온천천 서식 위치</div>' +
          '<div class="habitat-sub">초록빛으로 <b>천천히 반짝이는 곳</b>이 주요 서식 구간입니다.' +
            ' &middot; 서식 구간 <b>' + hb.reach + '</b></div>' +
          '<div class="mapbox">' +
            '<div class="rt">△ 상류(북)</div>' +
            '<div class="mapinner">' +
              '<img src="images/oncheon_map_base.png" alt="온천천 유역 지도">' +
              '<span class="spot" style="left:' + hb.x + '%;top:' + hb.y + '%;width:' + (hb.r * 2) + '%"></span>' +
            '</div>' +
            '<div class="rb">하류(남) ▽</div>' +
          '</div>' +
        '</div>';
    }
    var videoCol =
      '<div class="media-col media-right">' +
        '<div class="col-title">🎬 사진으로 만든 짧은 영상</div>' +
        '<div class="videobox">' +
          '<video src="images/video/' + c.id + '.mp4" autoplay muted loop playsinline></video>' +
        '</div>' +
        '<div class="video-cap">※ 실제 촬영 영상이 아니라, 위 사진에 움직임을 준 짧은 영상입니다.</div>' +
      '</div>';
    var mediaHtml = '<div class="media-row">' + mapCol + videoCol + '</div>';

    // 전환 애니메이션: 잠깐 숨겼다가 내용 교체 후 다시 보이기
    detailEl.classList.remove('show');
    setTimeout(function () {
      detailEl.innerHTML =
        '<div class="photo">' + photoInner + '</div>' +
        '<div class="body">' +
          '<h2>' + c.name + '<span class="badge">' + c.group + '</span></h2>' +
          sciHtml +
          '<div class="desc">' + c.desc + '</div>' +
          audioHtml +
          mediaHtml +
        '</div>';
      requestAnimationFrame(function () { detailEl.classList.add('show'); });
    }, 180);
  }

  // 처음에 첫 번째 생물 자동 선택
  if (creatures.length) select(creatures[0].id);

  /* 헤더에 떨어지는 꽃잎 */
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var wrap = document.querySelector('.page-hero .petals');
    if (!wrap) return;
    var cols = [
      'linear-gradient(135deg,#ffe3ee,#f7abc8)',
      'linear-gradient(135deg,#ffffff,#ffd4e5)',
      'linear-gradient(135deg,#ffd0e1,#ef9dbc)'
    ];
    for (var i = 0; i < 16; i++) {
      var p = document.createElement('span'); p.className = 'petal';
      var leaf = document.createElement('i');
      var s = 8 + Math.random() * 8;
      leaf.style.width = s + 'px'; leaf.style.height = s + 'px';
      leaf.style.background = cols[i % 3];
      leaf.style.animationDuration = (2.4 + Math.random() * 2.6) + 's';
      leaf.style.animationDelay = (-Math.random() * 4) + 's';
      p.style.left = (Math.random() * 100) + '%';
      p.style.animationDuration = (6 + Math.random() * 7) + 's';
      p.style.animationDelay = (-Math.random() * 12) + 's';
      p.appendChild(leaf); wrap.appendChild(p);
    }
  })();
</script>
</body>
</html>
